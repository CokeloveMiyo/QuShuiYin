<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>清影 API</title>
  <style>
    :root {
      --ink: #0d1117;
      --muted: #5b6775;
      --accent: #b8f000;
      --bg: #eef2f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 50% at 15% 0%, rgba(125, 211, 252, 0.4), transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 10%, rgba(184, 240, 0, 0.25), transparent 50%),
        var(--bg);
    }
    .card {
      width: min(440px, calc(100% - 2rem));
      padding: 2rem;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(13, 17, 23, 0.08);
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.1);
    }
    .mark {
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 0.7rem;
      margin-bottom: 1rem;
      background:
        linear-gradient(135deg, var(--accent) 0%, var(--accent) 55%, transparent 55%),
        linear-gradient(315deg, #7dd3fc 0%, #7dd3fc 40%, #0d1117 40%);
    }
    h1 {
      margin: 0 0 0.4rem;
      font-size: 1.6rem;
      letter-spacing: -0.03em;
    }
    p { margin: 0; color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true"></div>
    <h1>清影 API</h1>
    <p>解析服务运行中。请使用前端站点进行粘贴解析与下载。</p>
  </div>
</body>
</html>
